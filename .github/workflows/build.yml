name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/CustomWin/CustomWin.csproj -c Release

      - name: Publish lite (нужен .NET 8 Desktop Runtime)
        run: dotnet publish src/CustomWin/CustomWin.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/lite

      - name: Publish standalone (ничего ставить не нужно)
        run: dotnet publish src/CustomWin/CustomWin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/standalone

      - uses: actions/upload-artifact@v4
        with:
          name: CustomWin-lite-win-x64
          path: publish/lite/CustomWin.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CustomWin-standalone-win-x64
          path: publish/standalone/CustomWin.exe

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path publish/lite/CustomWin.exe -DestinationPath CustomWin-lite-win-x64.zip
          Compress-Archive -Path publish/standalone/CustomWin.exe -DestinationPath CustomWin-standalone-win-x64.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CustomWin-lite-win-x64.zip
            CustomWin-standalone-win-x64.zip
